<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="manifest" href="../manifest.json">

		<link rel="stylesheet" href="/css/stylesheet.css">
		<link rel="stylesheet" href="/css/distanceCounter.css">

		<!-- Classes -->
		<script src="/classes/BusMap.js" defer></script>
		<script src="/classes/Bus.js" defer></script>
		<script src="/classes/Geoloc.js" defer></script>

		<!-- Socket.io -->
		<script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script> 

		<!-- Map stuff -->		
    	<link href="https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.css" rel="stylesheet" />
		<script src="https://unpkg.com/@turf/turf@^7/turf.min.js"></script>

		<script src="../vehicleLocationInterpolation.js" defer></script>
		<script src="../retrieveVehicleDataFromServer.js" defer></script>
		<script src="../retrieveTimetableFromServer.js" defer></script>
		<script src="../retrieveTripUpdateDataFromServer.js" defer></script>
		<script src="../getLocation.js" defer></script>
		<script src="../distanceCounter.js" defer></script>
		<script src="../getNextStop.js" defer></script>
		<script src="../boardedStatus.js" defer></script>
		<script src="../mapStuff.js" defer></script>
		<script src="../rotation.js" defer></script>

		<!-- Icon Stuff -->
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=map,my_location,near_me" />
	</head>

	<body id="tempVehicleOutput">
		<div id="meta-body-container">
			<div id="header-container">
				<!-- <div id="header-name-obj">
					<h1 id="G10-name-header">the G10 Enthusiasts</h1>
				</div> -->
				<div id="boarded-status">boarded status: </div>
				<div id="distance-container">
					<div id="prism">
						<div class="face front">
							<div id="route">G10</div>
							<div id="distance-counter"></div>
							<div id="closest-fleet-number"></div>
						</div>
						<div class="face bottom">
							<p>Welcome Aboard!</p>
						</div>
					</div>
					<div id="throbber"><img src="../media/g10throbber.gif"></div>
				</div>
				<div id="distance-counter-last-updated-time">Closest G10 Bus - Updated 0 seconds ago...</div>
				<div id="next-stop">next stop: </div>

				<img id="rotation" src="../media/g10.gif">

				<br>
			</div>
			<div id="map"></div>
			<div id="map-buttons">
				<button class="selected"><span class="material-symbols-outlined">map</span></button>
				<button><span class="material-symbols-outlined">near_me</span></button>
				<button><span class="material-symbols-outlined">my_location</span></button>
			</div>
			<div id="fade"></div>
			<img src="../media/book.gif">
		</div>
		<p id="debug"></p>
		<p id="debug2"></p>

		<script type="module">
			import * as maplibregl from "https://unpkg.com/maplibre-gl@^6.0.0/dist/maplibre-gl.mjs";
			globalThis.maplibregl = maplibregl;
		</script>
	</body>
</html>
